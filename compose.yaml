# MediView 전체 스택. 앱 이미지는 각 저장소 CI 가 GHCR 로 빌드/푸시한다.
# 배포: 서버에서  cp .env.example .env  → 값 채우고  docker compose pull && docker compose up -d
name: mediview

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mediview}
      MARIADB_USER: ${DB_USER:-mediview}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    # 불변 SHA 태그 강제(가변 :latest 금지) — 배포/롤백이 정확히 어떤 빌드인지 특정된다.
    image: ghcr.io/mediview-app/mediview-backend:${IMAGE_TAG:?IMAGE_TAG(불변 SHA 태그)를 지정하세요}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-mediview}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediview}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}                       # Base64 32B+
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}       # Base64 32B (민감 컬럼 암호화)
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-https://*.mediview.example.com}
      TURN_ENABLED: "true"
      TURN_HOST: ${TURN_REALM:?}
      TURN_STATIC_AUTH_SECRET: ${TURN_SECRET:?}         # coturn TURN_SECRET 과 동일해야 함
    expose:
      - "8080"
    # 백엔드 이미지(빌드팩 기반)에는 curl/wget 보장이 없어 컨테이너 자체 healthcheck 는
    # 오탐 위험이 있다. 준비 상태는 배포 스크립트가 네트워크상에서 /actuator/health 를
    # 외부 프로브(curlimages/curl)로 검증한다 — 도구 의존 없이 신뢰 가능.

  ai:
    image: ghcr.io/mediview-app/mediview-ai:${IMAGE_TAG:?IMAGE_TAG(불변 SHA 태그)를 지정하세요}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8001"

  landing:
    image: ghcr.io/mediview-app/mediview-landing:${IMAGE_TAG:?IMAGE_TAG(불변 SHA 태그)를 지정하세요}
    restart: unless-stopped
    expose:
      - "3000"
    # Next 서버(node) 내장 런타임으로 자체 응답 확인 — 별도 도구 의존 없음.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    image: ghcr.io/mediview-app/mediview-admin:${IMAGE_TAG:?IMAGE_TAG(불변 SHA 태그)를 지정하세요}
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # 프런트(healthy) 뒤에 트래픽 프록시를 올린다(준비 전 502 방지). 백엔드는
    # 컨테이너 healthcheck 가 없어 service_started 로 두고, 실제 준비는 배포 스크립트가 검증.
    depends_on:
      backend:
        condition: service_started
      landing:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./stack/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro          # certbot 발급 인증서
      - ./certbot/www:/var/www/certbot:ro           # ACME 챌린지 웹루트
    # 갱신된 인증서 반영을 위해 6시간마다 reload
    command: sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Let's Encrypt 인증서 자동 갱신 (webroot 방식). 최초 발급은 ./init-letsencrypt.sh 참고.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  # TURN 은 넓은 UDP 릴레이 포트 때문에 host 네트워크를 사용한다.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${EXTERNAL_IP:?}
      - --realm=${TURN_REALM:?}
      - --server-name=${TURN_REALM}
      - --static-auth-secret=${TURN_SECRET:?}

  # mariadb 정기 백업(일 1회 덤프 + gzip) + 보존기간 경과분 자동 삭제 → ./backups
  db-backup:
    image: mariadb:11
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-mediview}
      DB_USER: ${DB_USER:-mediview}
      DB_PASSWORD: ${DB_PASSWORD:?}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  # 오프사이트 백업(선택): ./backups 를 rclone 원격(S3/GDrive 등)으로 주기 동기화.
  # 활성화:  docker compose --profile offsite up -d   (backup/rclone.conf 필요)
  offsite-backup:
    image: rclone/rclone:1
    restart: unless-stopped
    profiles: ["offsite"]
    depends_on: [db-backup]
    environment:
      RCLONE_REMOTE: "${RCLONE_REMOTE:?rclone 원격 경로가 필요합니다 - 예 s3remote:mediview-backups}"
    volumes:
      - ./backup/rclone.conf:/config/rclone/rclone.conf:ro
      - ./backups:/data:ro
    entrypoint: ["/bin/sh", "-c", "while :; do rclone sync /data \"$$RCLONE_REMOTE\" --stats-one-line; sleep 6h; done"]

volumes:
  db-data:
