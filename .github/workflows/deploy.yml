name: deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 불변 이미지 태그(권장: 커밋 SHA). :latest 금지."
        required: true
        type: string

# 동시 배포 방지 — 진행 중 배포가 끝난 뒤에만 다음 배포가 시작된다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard (image_tag 검증)
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "image_tag 는 필수이며 :latest 를 쓸 수 없습니다(불변 SHA 지정)."
            exit 1
          fi

      - name: Deploy over SSH (health-gated, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: "15m"
          script: |
            set -u
            IMAGE_TAG="${{ inputs.image_tag }}"
            NET="mediview_default"

            # GHCR private 이미지 pull 로그인
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            cd "${{ secrets.DEPLOY_PATH }}"

            # 롤백 기준: 현재 .env 에 기록된 직전 태그
            PREV_TAG="$(grep -E '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2- || true)"
            echo "이전 태그: ${PREV_TAG:-(없음)} → 신규 태그: $IMAGE_TAG"

            set_tag() {
              if grep -qE '^IMAGE_TAG=' .env 2>/dev/null; then
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$1|" .env
              else
                echo "IMAGE_TAG=$1" >> .env
              fi
            }

            # 네트워크상에서 서비스 준비 상태를 외부 프로브로 확인(이미지 도구 의존 없음).
            probe() { docker run --rm --network "$NET" curlimages/curl:8.11.1 -fsS --max-time 5 "$1" >/dev/null 2>&1; }

            rollback() {
              echo "::error::헬스 확인 실패 — 롤백 시작"
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
                set_tag "$PREV_TAG"
                export IMAGE_TAG="$PREV_TAG"
                docker compose up -d --remove-orphans || echo "::error::롤백 up 실패 — 수동 확인 필요"
                echo "이전 태그($PREV_TAG)로 롤백 완료"
              else
                echo "::error::이전 태그가 없어 자동 롤백 불가 — 수동 확인 필요"
              fi
              exit 1
            }

            export IMAGE_TAG
            set_tag "$IMAGE_TAG"

            # 새 이미지 받기(실패 시 기존 스택 그대로, 롤백 재기동)
            docker compose pull || rollback
            docker compose up -d --remove-orphans || rollback

            # 헬스 게이트: 백엔드 actuator(DB·마이그레이션 포함) + admin + landing 이
            # 모두 정상 응답할 때까지 최대 ~150s 대기. 미충족 시 자동 롤백.
            healthy=0
            for i in $(seq 1 30); do
              if probe http://backend:8080/actuator/health \
                 && probe http://admin:3001/login \
                 && probe http://landing:3000/; then
                healthy=1; break
              fi
              echo "헬스 대기... ($i/30)"
              sleep 5
            done
            [ "$healthy" -eq 1 ] || rollback

            echo "배포 성공 — IMAGE_TAG=$IMAGE_TAG"
            docker image prune -f
